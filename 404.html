<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f3e8">
  <title>404 - Luca DiGrigoli</title>
  <style>
    :root { --cell: 28px; }

    body {
      margin: 0;
      padding: 20px 10px 40px;
      color: #222;
      font-family: Verdana, Geneva, sans-serif;
      background: #f5f3e8;
      text-align: center;
    }

    a { color: #8b4513; }

    h1 {
      color: #8b4513;
      font-size: 2rem;
      margin: 0 0 4px;
    }

    .intro { max-width: 500px; margin: 0 auto 16px; font-size: .9rem; }

    .scorebar {
      width: min(100%, calc(var(--cell) * 24 + 4px));
      margin: 0 auto 6px;
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      font-weight: bold;
    }

    .board-wrap {
      position: relative;
      width: min(100%, calc(var(--cell) * 24 + 4px));
      margin: 0 auto;
      border: 3px solid #8b4513;
      touch-action: none;
      overflow: hidden;
    }

    canvas { display: block; width: 100%; height: auto; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f3e8;
    }

    .overlay[hidden] { display: none; }

    .overlay h2 { margin: 0 0 6px; color: #8b4513; }
    .overlay p { max-width: 380px; margin: 0 0 14px; }

    .button {
      border: 2px solid #8b4513;
      padding: 8px 18px;
      color: #fff;
      background: #8b4513;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
    }

    .button:hover { background: #a0522d; }

    .controls {
      width: 170px;
      margin: 16px auto 10px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
      justify-content: center;
    }

    .control {
      border: 1px solid #8b4513;
      color: #8b4513;
      background: #fff;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .control-up { grid-column: 2; }
    .control-left { grid-column: 1; grid-row: 2; }
    .control-down { grid-column: 2; grid-row: 2; }
    .control-right { grid-column: 3; grid-row: 2; }

    .footer-note { margin: 4px 0 0; font-size: .78rem; color: #555; }

    .home-link { display: inline-block; margin-top: 12px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    @media (max-width: 720px) {
      :root { --cell: calc((100vw - 36px) / 24); }
    }
  </style>
</head>
<body>
  <h1>404 - page not found</h1>
  <p class="intro">this page doesn't exist. play snake while you're here I guess</p>

  <div class="scorebar" aria-live="polite">
    <span>records: <span id="score">0</span></span>
    <span>best: <span id="best">0</span></span>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="game" width="672" height="448" aria-label="Album artwork snake game" role="img"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">album snake</h2>
      <p id="overlayCopy">arrow keys, WASD, swipe, or the buttons below. the squares are album covers.</p>
      <button class="button" id="startButton" type="button">start</button>
    </div>
  </div>

  <div class="controls" aria-label="Game controls">
    <button class="control control-up" type="button" data-direction="up" aria-label="Move up">↑</button>
    <button class="control control-left" type="button" data-direction="left" aria-label="Move left">←</button>
    <button class="control control-down" type="button" data-direction="down" aria-label="Move down">↓</button>
    <button class="control control-right" type="button" data-direction="right" aria-label="Move right">→</button>
  </div>

  <p class="footer-note">arrow keys / WASD, space to pause, swipe on mobile</p>
  <a class="home-link" href="/">&larr; back home</a>
  <p class="sr-only" id="status" aria-live="polite"></p>

  <script>
    (() => {
      "use strict";

      const COLS = 24;
      const ROWS = 16;
      const SIZE = 28;
      const SPEED = 145;
      const ARTWORK = [
        { src: "images/kissandtell-cover-preview.jpg", name: "The Kiss and Tell Show" },
        { src: "beautifulGirl.webp", name: "Beautiful Girl" },
        { src: "images/technicolor.png", name: "Technicolor Daydream" },
        { src: "images/521cover.webp", name: "521" },
        { src: "images/pretend.webp", name: "Pretend" },
        { src: "images/valerie.webp", name: "Valerie" },
        { src: "images/yuletide.webp", name: "Yuletide" },
        { src: "images/binghamtonLogo.webp", name: "Christmas Album" },
        { src: "images/gordon.webp", name: "Gordon" },
        { src: "images/bridge.webp", name: "Bridge" },
        { src: "images/gang.webp", name: "Gang" },
        { src: "images/station.webp", name: "Station" },
        { src: "images/thecup.webp", name: "The Cup" },
        { src: "images/train.webp", name: "Train" },
        { src: "images/aura.webp", name: "Aura" }
      ];

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const board = document.getElementById("boardWrap");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayCopy = document.getElementById("overlayCopy");
      const startButton = document.getElementById("startButton");
      const scoreNode = document.getElementById("score");
      const bestNode = document.getElementById("best");
      const statusNode = document.getElementById("status");
      const images = [];

      let snake = [];
      let direction = { x: 1, y: 0 };
      let queuedDirection = { x: 1, y: 0 };
      let food = { x: 20, y: 8 };
      let score = 0;
      let best = Number.parseInt(localStorage.getItem("albumSnakeBest") || "0", 10);
      let timer = null;
      let running = false;
      let paused = false;
      let touchStart = null;

      bestNode.textContent = best;

      ARTWORK.forEach((art, index) => {
        const image = new Image();
        image.src = art.src;
        image.alt = art.name;
        image.onload = draw;
        image.onerror = draw;
        images[index] = image;
      });

      function reset() {
        snake = ARTWORK.map((_, index) => ({ x: 17 - index, y: 8 }));
        direction = { x: 1, y: 0 };
        queuedDirection = { x: 1, y: 0 };
        score = 0;
        paused = false;
        scoreNode.textContent = score;
        placeFood();
        draw();
      }

      function start() {
        window.clearInterval(timer);
        reset();
        overlay.hidden = true;
        running = true;
        timer = window.setInterval(tick, SPEED);
        statusNode.textContent = "Game started";
      }

      function tick() {
        if (!running || paused) return;
        direction = queuedDirection;
        const head = snake[0];
        const next = { x: head.x + direction.x, y: head.y + direction.y };
        const hitWall = next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS;
        const hitSelf = snake.some(segment => segment.x === next.x && segment.y === next.y);

        if (hitWall || hitSelf) {
          endGame();
          return;
        }

        snake.unshift(next);
        if (next.x === food.x && next.y === food.y) {
          score += 1;
          scoreNode.textContent = score;
          placeFood();
          statusNode.textContent = `Collected record ${score}`;
        } else {
          snake.pop();
        }
        draw();
      }

      function placeFood() {
        do {
          food = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
          };
        } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
      }

      function endGame() {
        running = false;
        window.clearInterval(timer);
        if (score > best) {
          best = score;
          bestNode.textContent = best;
          localStorage.setItem("albumSnakeBest", String(best));
        }
        overlayTitle.textContent = "tour cancelled";
        overlayCopy.textContent = `You collected ${score} record${score === 1 ? "" : "s"}. The discography demands an encore.`;
        startButton.textContent = "play again";
        overlay.hidden = false;
        statusNode.textContent = `Game over. Score ${score}.`;
      }

      function setDirection(next) {
        if (!running) return;
        const options = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        const value = options[next];
        if (!value || (value.x === -direction.x && value.y === -direction.y)) return;
        queuedDirection = value;
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        overlayTitle.textContent = "intermission";
        overlayCopy.textContent = "The albums are taking five.";
        startButton.textContent = "resume";
        overlay.hidden = !paused;
        statusNode.textContent = paused ? "Game paused" : "Game resumed";
      }

      function drawCover(image, x, y, isHead) {
        const inset = isHead ? 1 : 2;
        const px = x * SIZE + inset;
        const py = y * SIZE + inset;
        const side = SIZE - inset * 2;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(px, py, side, side, isHead ? 6 : 3);
        ctx.clip();
        if (image && image.complete && image.naturalWidth) {
          const crop = Math.min(image.naturalWidth, image.naturalHeight);
          const sx = (image.naturalWidth - crop) / 2;
          const sy = (image.naturalHeight - crop) / 2;
          ctx.drawImage(image, sx, sy, crop, crop, px, py, side, side);
        } else {
          ctx.fillStyle = isHead ? "#8b4513" : "#d4c4a0";
          ctx.fillRect(px, py, side, side);
        }
        ctx.restore();

        ctx.strokeStyle = isHead ? "#fffdf5" : "rgba(255,253,245,.8)";
        ctx.lineWidth = isHead ? 2 : 1;
        ctx.strokeRect(px + .5, py + .5, side - 1, side - 1);

        if (isHead) {
          const eyeY = py + side * .38;
          ctx.fillStyle = "#fffdf5";
          ctx.beginPath();
          if (direction.x !== 0) {
            const eyeX = direction.x > 0 ? px + side * .77 : px + side * .23;
            ctx.arc(eyeX, eyeY, 2.5, 0, Math.PI * 2);
            ctx.arc(eyeX, py + side * .67, 2.5, 0, Math.PI * 2);
          } else {
            const verticalY = direction.y > 0 ? py + side * .75 : py + side * .25;
            ctx.arc(px + side * .34, verticalY, 2.5, 0, Math.PI * 2);
            ctx.arc(px + side * .68, verticalY, 2.5, 0, Math.PI * 2);
          }
          ctx.fill();
        }
      }

      function drawFood() {
        const cx = food.x * SIZE + SIZE / 2;
        const cy = food.y * SIZE + SIZE / 2;
        ctx.save();
        ctx.shadowColor = "rgba(139,69,19,.4)";
        ctx.shadowBlur = 7;
        ctx.fillStyle = "#2a2a2a";
        ctx.beginPath();
        ctx.arc(cx, cy, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#f5f3e8";
        ctx.beginPath();
        ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(245,243,232,.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, 5.7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#eee9d9";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(139,69,19,.09)";
        ctx.lineWidth = 1;
        for (let x = 1; x < COLS; x += 1) {
          ctx.beginPath();
          ctx.moveTo(x * SIZE + .5, 0);
          ctx.lineTo(x * SIZE + .5, canvas.height);
          ctx.stroke();
        }
        for (let y = 1; y < ROWS; y += 1) {
          ctx.beginPath();
          ctx.moveTo(0, y * SIZE + .5);
          ctx.lineTo(canvas.width, y * SIZE + .5);
          ctx.stroke();
        }

        drawFood();
        for (let index = snake.length - 1; index >= 0; index -= 1) {
          const segment = snake[index];
          drawCover(images[index % images.length], segment.x, segment.y, index === 0);
        }
      }

      startButton.addEventListener("click", () => {
        if (running && paused) {
          paused = false;
          overlay.hidden = true;
          statusNode.textContent = "Game resumed";
        } else {
          start();
        }
      });

      document.querySelectorAll("[data-direction]").forEach(button => {
        button.addEventListener("pointerdown", () => setDirection(button.dataset.direction));
      });

      document.addEventListener("keydown", event => {
        const keys = {
          ArrowUp: "up", w: "up", W: "up",
          ArrowDown: "down", s: "down", S: "down",
          ArrowLeft: "left", a: "left", A: "left",
          ArrowRight: "right", d: "right", D: "right"
        };
        if (keys[event.key]) {
          event.preventDefault();
          setDirection(keys[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          togglePause();
        } else if (event.key === "Enter" && !running) {
          start();
        }
      });

      board.addEventListener("pointerdown", event => {
        touchStart = { x: event.clientX, y: event.clientY };
      });

      board.addEventListener("pointerup", event => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
        setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && running && !paused) togglePause();
      });

      reset();
    })();
  </script>
</body>
</html>
