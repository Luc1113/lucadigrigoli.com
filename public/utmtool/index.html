<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTM QR Generator</title>
<style>
body{font-family:Arial,sans-serif;background:white;color:black;margin:40px 20px}main{max-width:560px;margin:auto}h1{font-size:24px}p{margin-bottom:24px}label{display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #888}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}button{font:inherit;padding:10px 14px;border:0;color:white;cursor:pointer}.red{background:#c33}.blue{background:#2563c7}#actions[hidden]{display:none}#error{color:#b00;margin-top:10px}small{display:block;margin-top:24px;color:#555}
</style></head><body><main>
<h1>UTM QR Generator</h1><p>Paste a URL to download an SVG QR code for either placement.</p>
<label for="url">Destination URL</label><input id="url" type="url" placeholder="https://example.com/page" autocomplete="url" spellcheck="false">
<div id="error" role="status" aria-live="polite"></div>
<div class="actions" id="actions" hidden><button class="red" id="poster">Download Poster UTM QR</button><button class="blue" id="box">Download Box UTM QR</button></div>
<small>Runs locally. Poster UTM is a placeholder until finalized.</small>
</main><script src="/utmtool/qrcode.min.js"></script><script>
/* Replace these placeholders with the final constant UTM suffixes. */
const POSTER_SUFFIX = '?placeholder1';
const BOX_SUFFIX = '/?utm_source=APQR&utm_medium=pizzabox';
const input=document.getElementById('url'), actions=document.getElementById('actions'), error=document.getElementById('error');
function getURL(){try{const u=new URL(input.value.trim());if(!['http:','https:'].includes(u.protocol))throw Error();return u}catch{return null}}
function update(){const valid=!!getURL();actions.hidden=!valid;error.textContent=input.value.trim()&&!valid?'Enter a valid http:// or https:// URL.':''}
input.addEventListener('input',update);
function addSuffix(base,suffix){
  const url=new URL(base);
  const query=suffix.replace(/^[?&]/,'');
  if(query){const params=new URLSearchParams(query);for(const [k,v] of params)url.searchParams.append(k,v)}
  return url.toString();
}
function download(kind,suffix){
 const base=getURL();if(!base){update();return}
 const target=addSuffix(base,suffix);
 const qr=qrcode(0,'H');qr.addData(target);qr.make();
 const modules=qr.getModuleCount(), quiet=4, scale=12, dimension=(modules+quiet*2)*scale;
 const cell=10, size=(modules+quiet*2)*cell;
 let rects='';
 for(let r=0;r<modules;r++)for(let c=0;c<modules;c++)if(qr.isDark(r,c))rects+=`<rect x="${(c+quiet)*cell}" y="${(r+quiet)*cell}" width="${cell}" height="${cell}"/>`;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="white"/><g fill="black">${rects}</g></svg>`;
 const blob=new Blob([svg],{type:'image/svg+xml'}), objectURL=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=objectURL;a.download=`${kind}-utm-qr.svg`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectURL),1000);
}
document.getElementById('poster').addEventListener('click',()=>download('poster',POSTER_SUFFIX));
document.getElementById('box').addEventListener('click',()=>download('box',BOX_SUFFIX));
</script></body></html>
